  <script src="js/webflow.js" type="text/javascript"></script>
  <script>
    /* RSVP -> Netlify Forms : court-circuite la soumission Webflow et envoie
       les donnees a Netlify en AJAX. Stocke aussi les reponses pour la page merci. */
    (function () {
      var form = document.getElementById('email-form');
      if (!form) return;

      document.addEventListener('submit', function (e) {
        if (e.target !== form) return;
        e.preventDefault();
        e.stopPropagation();

        var pot = form.querySelector('[name="bot-field"]');
        if (pot && pot.value) return;

        var fd = new FormData(form);

        // Memoriser les reponses pour le recapitulatif de la page merci
        try {
          var obj = {};
          fd.forEach(function (v, k) { if (k !== 'bot-field' && k !== 'form-name') obj[k] = v; });
          sessionStorage.setItem('rsvpData', JSON.stringify(obj));
        } catch (err) {}

        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(fd).toString()
        })
        .then(function () { window.location.href = '/programme/merci.html'; })
        .catch(function () { alert("Une erreur reseau est survenue. Merci de reessayer ou de nous contacter."); });
      }, true);
    })();
  </script>
